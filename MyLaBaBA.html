<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Phum 💛</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: linear-gradient(45deg, #ffd54f, #ff8a80);
  text-align: center;
  color: white;
  overflow-x: hidden;
}

.container {
  padding: 40px;
}

button {
  padding: 12px 20px;
  margin: 10px;
  border: none;
  border-radius: 25px;
  background: white;
  color: #ff6f61;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
  background: #fff3cd;
}

.hidden { display: none; }

img {
  width: 250px;
  border-radius: 20px;
  margin: 10px;
}

.heart {
  position: fixed;
  animation: float 4s linear infinite;
}

@keyframes float {
  0% {transform: translateY(100vh);}
  100% {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<audio id="bgmusic" src="song.mp3" loop></audio>

<!-- 🔐 หน้าใส่รหัส -->
<div class="container" id="lockScreen">
  <h1>🔐 ใส่รหัสลับก่อนเข้า 💛</h1>
  <input type="password" id="password" placeholder="ใส่รหัส..." />
  <br><br>
  <button onclick="checkPassword()">เข้าเลย</button>
</div>

<!-- หน้าแนะนำ -->
<div class="container hidden" id="welcomeScreen">
  <h1>💛 ถึงภูมิ 💛</h1>
  <p>เราเจอกันวันที่ 14 พฤศจิกายน 2025</p>
  <p>และจะมีวันสำคัญทุก ๆ 19 ตุลา</p>
  <h2 id="countdown"></h2>
  <button onclick="showGallery()">ดูความทรงจำ</button>
</div>

<!-- 📸 แกลเลอรี่ -->
<div class="container hidden" id="galleryScreen">
  <h2>ทริปแรกของเรา 💛</h2>
  <p>อุทยานภูหินร่องกล้า</p>
  <img src="photo1.jpg">
  <img src="photo2.jpg">
  <img src="photo3.jpg">
  <br>
  <button onclick="startGame()">เล่นเกมต่อ</button>
</div>

<!-- 🎮 เกม -->
<div class="container hidden" id="quizScreen">
  <h2 id="question"></h2>
  <div id="answers"></div>
</div>

<!-- 🎉 ผลลัพธ์ -->
<div class="container hidden" id="resultScreen">
  <h1 id="resultText"></h1>
  <p id="scoreText"></p>
</div>

<script>

// 🔐 รหัส = 1910
function checkPassword() {
  let pass = document.getElementById("password").value;
  if (pass === "1910") {
    document.getElementById("lockScreen").classList.add("hidden");
    document.getElementById("welcomeScreen").classList.remove("hidden");
    document.getElementById("bgmusic").play();
  } else {
    alert("รหัสผิดนะคนเก่ง 🤭");
  }
}

// ⏳ นับถอยหลังถึง 19 ตุลา
function updateCountdown() {
  const target = new Date("October 19, 2026 00:00:00").getTime();
  const now = new Date().getTime();
  const distance = target - now;

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  document.getElementById("countdown").innerText =
    "เหลืออีก " + days + " วัน ถึง 19 ตุลา 💛";
}
setInterval(updateCountdown, 1000);

// 📸
function showGallery() {
  document.getElementById("welcomeScreen").classList.add("hidden");
  document.getElementById("galleryScreen").classList.remove("hidden");
}

// 🎮 คำถาม
const questions = [
  {
    question: "ไปเที่ยวด้วยกันครั้งแรกที่ไหน?",
    answers: ["ทะเล", "อุทยานภูหินร่องกล้า", "เชียงใหม่"],
    correct: 1
  },
  {
    question: "เค้าชอบสีอะไร?",
    answers: ["ฟ้า", "เหลือง", "เขียว"],
    correct: 1
  },
  {
    question: "เค้าชอบกินอะไร?",
    answers: ["โค้กซีโร่", "นมสด", "กาแฟ"],
    correct: 0
  },
  {
    question: "เค้าไม่ชอบกินอะไร?",
    answers: ["กะทิ", "กระเทียม", "ลูกชิ้นปลา", "ถูกทุกข้อ"],
    correct: 3
  }
];

let currentQuestion = 0;
let score = 0;

function startGame() {
  document.getElementById("galleryScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");
  showQuestion();
}

function showQuestion() {
  let q = questions[currentQuestion];
  document.getElementById("question").innerText = q.question;
  let answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  q.answers.forEach((answer, index) => {
    let btn = document.createElement("button");
    btn.innerText = answer;
    btn.onclick = () => selectAnswer(index);
    answersDiv.appendChild(btn);
  });
}

function selectAnswer(index) {
  if (index === questions[currentQuestion].correct) {
    score++;
  }
  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  document.getElementById("scoreText").innerText =
    "ภูมิได้ " + score + " / " + questions.length;

  document.getElementById("resultText").innerText =
    "ไม่ว่าจะตอบได้กี่ข้อ เค้าก็รักภูมิทุกวัน 💛";

  startHearts();
}

function startHearts() {
  setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💛";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => { heart.remove(); }, 4000);
  }, 300);
}

</script>

</body>
</html>
